name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}"

    # Non-EOL Ruby and Rails only; see endoflife.date/ruby and endoflife.date/rails.
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["8.0", "8.1"]

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/test/gemfiles/rails-${{ matrix.rails }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake gem:test
