name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Ruby ${{ matrix.ruby }} / ${{ matrix.deps.name }}"

    # Non-EOL Ruby and Rails only; see endoflife.date/ruby and endoflife.date/rails.
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        deps:
          - { name: "Rails 8.0", gemfile: test/gemfiles/rails-8.0 }
          - { name: "Rails 8.1", gemfile: test/gemfiles/rails-8.1 }
          # The committed root lockfile, so Dependabot bumps to it are actually tested.
          - { name: "Gemfile.lock", gemfile: Gemfile }

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.deps.gemfile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake gem:test
